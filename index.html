<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff7b89" />
  <title>Đếm ngược sinh nhật 30 tuổi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=DM+Mono:wght@500&family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; overflow-x: hidden; display: grid; place-items: center; color: #45263b; font-family: "Be Vietnam Pro", sans-serif; background: #fff4ec; }
    body::before, body::after { position: fixed; z-index: -2; width: 45vmax; height: 45vmax; border-radius: 50%; content: ""; filter: blur(2px); }
    body::before { top: -20vmax; left: -14vmax; background: #ffc3c9; }
    body::after { right: -17vmax; bottom: -22vmax; background: #ffd89b; }
    .sprinkles { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; opacity: .75; background-image: radial-gradient(#f28482 1.5px, transparent 1.6px), radial-gradient(#8075ff 1.5px, transparent 1.6px), radial-gradient(#f9ae51 1.5px, transparent 1.6px); background-position: 0 0, 37px 23px, 83px 71px; background-size: 127px 127px; }
    main { position: relative; width: min(950px, calc(100% - 32px)); margin: 30px 16px; padding: clamp(34px, 6vw, 66px); overflow: hidden; text-align: center; border: 1px solid rgba(255,255,255,.85); border-radius: 38px; background: rgba(255,253,250,.75); box-shadow: 0 22px 70px rgba(151,79,91,.18); backdrop-filter: blur(14px); }
    main::before { position: absolute; top: -115px; right: -95px; width: 235px; height: 235px; border: 20px solid rgba(255,183,119,.23); border-radius: 50%; content: ""; }
    .date { display: inline-flex; align-items: center; gap: 9px; margin: 0; padding: 9px 14px; border-radius: 99px; color: #bf5268; font-size: .73rem; font-weight: 800; letter-spacing: .08em; background: #ffe4df; }
    .cake { display: block; margin: 22px 0 10px; font-size: clamp(2.5rem, 6vw, 4.2rem); filter: drop-shadow(0 7px 6px rgba(146,75,73,.17)); animation: float 2.5s ease-in-out infinite alternate; }
    .eyebrow { margin: 0 0 8px; color: #b76b76; font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 750px; margin: 0 auto; font-size: clamp(2.1rem, 5.7vw, 4.8rem); font-weight: 800; letter-spacing: -.065em; line-height: 1.06; }
    h1 em { color: #f06f78; font-family: Pacifico, cursive; font-size: 1.05em; font-style: normal; font-weight: 400; letter-spacing: -.03em; white-space: nowrap; }
    .tease { max-width: 570px; margin: 20px auto 0; color: #765469; font-size: clamp(.9rem, 2vw, 1.05rem); line-height: 1.65; }
    .tease strong { color: #d65568; }
    .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1.8vw, 18px); margin-top: clamp(32px, 5vw, 53px); }
    .unit { padding: clamp(15px, 2.5vw, 25px) 7px 16px; border: 1px solid #f8dcd3; border-radius: 22px; background: linear-gradient(145deg, #fff, #fff7f2); box-shadow: 0 9px 18px rgba(162,100,95,.07); }
    .number { display: block; color: #4e3044; font-family: "DM Mono", monospace; font-size: clamp(1.7rem, 6vw, 4.7rem); font-variant-numeric: tabular-nums; letter-spacing: -.1em; line-height: 1; }
    .label { display: block; margin-top: 12px; color: #b57d80; font-size: clamp(.55rem, 1.2vw, .7rem); font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .footer { margin: 29px 0 0; color: #9d7880; font-size: .78rem; }
    .footer span { color: #ed7680; }
    .finished .countdown, .finished .tease, .finished .footer { display: none; }
    .finished .cake { animation: party .75s ease-in-out infinite alternate; }
    .finished h1 { color: #ee6976; font-size: clamp(2.9rem, 9vw, 7rem); }
    @keyframes float { to { transform: translateY(-8px) rotate(2deg); } }
    @keyframes party { to { transform: scale(1.1) rotate(-5deg); } }
    @media (max-width: 520px) { main { margin: 14px 10px; padding: 34px 14px; border-radius: 28px; } .countdown { gap: 6px; } .unit { border-radius: 15px; } .label { letter-spacing: .06em; } }
  </style>
</head>
<body>
  <div class="sprinkles"></div>
  <main id="card">
    <p class="date">✨ 10 THÁNG 10, 2026 · 00:00</p>
    <span class="cake" aria-hidden="true">🎂</span>
    <p class="eyebrow">Birthday countdown</p>
    <h1 id="headline">Đếm ngược đến tuổi <em>30 rực rỡ!</em></h1>
    <p class="tease">Một cột mốc rất xịn. Còn chuyện <strong>chính thức tập làm quen với U40</strong> thì… để từ từ tính nha! 😌</p>
    <section class="countdown" aria-label="Thời gian còn lại đến sinh nhật">
      <div class="unit"><output class="number" id="days">000</output><span class="label">Ngày</span></div>
      <div class="unit"><output class="number" id="hours">00</output><span class="label">Giờ</span></div>
      <div class="unit"><output class="number" id="minutes">00</output><span class="label">Phút</span></div>
      <div class="unit"><output class="number" id="seconds">00</output><span class="label">Giây</span></div>
    </section>
    <p class="footer">Còn chút xíu nữa là được thổi nến rồi <span>♥</span></p>
  </main>
  <script>
    const target = new Date('2026-10-10T00:00:00+07:00').getTime();
    const card = document.getElementById('card');
    const headline = document.getElementById('headline');
    const elements = ['days', 'hours', 'minutes', 'seconds'].map(id => document.getElementById(id));
    const pad = (value, digits = 2) => String(value).padStart(digits, '0');
    function updateCountdown() {
      let remaining = target - Date.now();
      if (remaining <= 0) {
        card.classList.add('finished');
        headline.innerHTML = 'Happy birthday! <em>30 tuổi rồi nha 🎉</em>';
        return;
      }
      const days = Math.floor(remaining / 86400000);
      remaining %= 86400000;
      const hours = Math.floor(remaining / 3600000);
      remaining %= 3600000;
      const minutes = Math.floor(remaining / 60000);
      const seconds = Math.floor((remaining % 60000) / 1000);
      [pad(days, 3), pad(hours), pad(minutes), pad(seconds)].forEach((value, index) => elements[index].textContent = value);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
